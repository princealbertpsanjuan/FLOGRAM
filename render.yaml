# =========================================================
# FLOGRAM on Render (Blueprint)
# Dashboard → New → Blueprint → pick this repository.
# Values marked "sync: false" are asked for on first deploy.
# See DEPLOYMENT.md for where to get each value.
# =========================================================
services:
  # ---------- API (Express + MongoDB) ----------
  - type: web
    name: flogram-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false

  # ---------- Admin web portal (Expo web export) ----------
  - type: web
    name: flogram-admin
    runtime: static
    rootDir: apps/mobile
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_API_URL
        sync: false
